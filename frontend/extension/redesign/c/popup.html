<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Work+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img class="brand-icon" src="../../icons/icon_32.png" alt="" />
      <h1>Monitar</h1>
    </div>
    <div class="header-actions">
      <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
        <svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
      </button>
      <button id="signout-btn" class="link hidden">Sign out</button>
    </div>
  </header>

  <!-- Setup nudge -->
  <section id="setup-nudge" class="hidden">
    <div class="nudge-card">
      <svg class="nudge-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 11l3 3L22 4" />
        <path d="M21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h11" />
      </svg>
      <h2 class="nudge-title">Finish setting up Monitar</h2>
      <p class="nudge-body">Takes about a minute — then your sessions save themselves.</p>
      <button id="nudge-btn">Finish setup</button>
    </div>
  </section>

  <!-- Auth view -->
  <section id="auth-view" class="hidden">
    <div class="tabs">
      <button id="tab-signin" class="tab active">Sign in</button>
      <button id="tab-signup" class="tab">Sign up</button>
    </div>

    <form id="auth-form">
      <input id="name" type="text" placeholder="Name" class="hidden" autocomplete="name" />
      <input id="email" type="email" placeholder="Email" autocomplete="email" required />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit" id="auth-submit">Sign in</button>
    </form>
  </section>

  <!-- Main view -->
  <section id="main-view" class="hidden">
    <!-- Active: a session is being tracked (shown as a hero card) -->
    <div id="active-panel" class="hidden">
      <div class="active-card">
        <span class="dot"></span>
        <div class="active-info">
          <div id="active-intent" class="session-title"></div>
          <div id="active-meta" class="session-meta"></div>
        </div>
        <button id="stop-btn">Stop &amp; save</button>
      </div>
    </div>

    <!-- Idle: start a new session -->
    <form id="start-form">
      <input id="intent" type="text" placeholder="What are you trying to discover?" />
      <label class="checkbox-row">
        <span class="checkbox">
          <input type="checkbox" id="include-open" />
          <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 12 9 17 20 6" /></svg>
        </span>
        Include tabs already open
      </label>
      <button type="submit" id="start-btn">Start session</button>
    </form>

    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input id="search-input" type="search" placeholder="Search with your own words.." autocomplete="off" />
      <span id="search-spinner" class="search-spinner hidden"></span>
    </div>
    <p id="model-status" class="model-status hidden"></p>

    <div id="sessions-section">
      <h2>Your sessions</h2>
      <ul id="session-list"></ul>
      <div id="empty-state" class="empty-state hidden">
        <svg class="empty-icon" width="40" height="32" viewBox="0 0 40 32" fill="none" aria-hidden="true">
          <path d="M2 9L9 2h27a2 2 0 0 1 2 2v20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="34" cy="27" r="5" fill="currentColor"/>
        </svg>
        <p class="muted">No sessions yet. Start one above — Monitar saves as you browse.</p>
      </div>
    </div>

    <ul id="search-results" class="hidden"></ul>
    <p id="no-results" class="muted hidden">Nothing matches. Try describing the work — "visa paperwork", "gift ideas".</p>
  </section>

  <p id="status" class="status hidden"></p>

  <script src="../../preview-shim.js"></script>
  <script>
    (function () {
      var KEY = "monitar_theme";
      var saved = localStorage.getItem(KEY);
      if (saved === "dark") document.documentElement.setAttribute("data-theme", "dark");
      document.getElementById("theme-toggle").addEventListener("click", function () {
        var isDark = document.documentElement.getAttribute("data-theme") === "dark";
        if (isDark) { document.documentElement.removeAttribute("data-theme"); localStorage.setItem(KEY, "light"); }
        else { document.documentElement.setAttribute("data-theme", "dark"); localStorage.setItem(KEY, "dark"); }
      });
    })();
  </script>
  <script type="module" src="../../popup.js"></script>
</body>
</html>
